services:
  - type: web
    name: pigeon-api
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: npm exec --yes --package=prisma@6.19.3 -- prisma migrate deploy
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: pigeon-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pigeon-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: pigeon-redis
    plan: 256mb
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: pigeon-postgres
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: '17'
    databaseName: pigeon
    user: pigeon
    ipAllowList: []
    connectionPool: none
