x-app-environment: &app-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HOST: 0.0.0.0
  PORT: 3000
  HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-2000}
  METRICS_COLLECTION_TIMEOUT_MS: ${METRICS_COLLECTION_TIMEOUT_MS:-2000}
  DATABASE_URL: postgresql://pigeon:pigeon@postgres:5432/pigeon?schema=public
  REDIS_URL: redis://redis:6379
  DELIVERY_TIMEOUT_MS: ${DELIVERY_TIMEOUT_MS:-10000}
  DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-6}
  DELIVERY_BACKOFF_JITTER: ${DELIVERY_BACKOFF_JITTER:-0.2}
  DELIVERY_WORKER_CONCURRENCY: ${DELIVERY_WORKER_CONCURRENCY:-10}
  DELIVERY_SUBSCRIPTION_CONCURRENCY: ${DELIVERY_SUBSCRIPTION_CONCURRENCY:-1}
  DELIVERY_THROTTLE_DELAY_MS: ${DELIVERY_THROTTLE_DELAY_MS:-1000}
  DELIVERY_OUTBOX_POLL_INTERVAL_MS: ${DELIVERY_OUTBOX_POLL_INTERVAL_MS:-1000}
  DELIVERY_OUTBOX_BATCH_SIZE: ${DELIVERY_OUTBOX_BATCH_SIZE:-100}
  INGESTION_RATE_LIMIT_WINDOW_MS: ${INGESTION_RATE_LIMIT_WINDOW_MS:-60000}
  INGESTION_RATE_LIMIT_MAX_REQUESTS: ${INGESTION_RATE_LIMIT_MAX_REQUESTS:-100}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pigeon
      POSTGRES_USER: pigeon
      POSTGRES_PASSWORD: pigeon
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username=pigeon --dbname=pigeon']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migration:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://pigeon:pigeon@postgres:5432/pigeon?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runtime
    environment: *app-environment
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
